# Proxy settings for one TYPO3 location.  Install as /etc/nginx/snippets/typo3-proxy.conf and use it as
#   location ... { include snippets/typo3-proxy.conf; }
# Needs conf.d/typo3-upstream.conf (upstream `typo3_stack`) and nginx >= 1.19.3 (proxy_cookie_flags).

proxy_pass http://typo3_stack;
proxy_http_version 1.1;
proxy_set_header Connection "";

# Keep the original Host, so TYPO3 resolves the right site, trustedHostsPattern matches and cookies
# are issued for this domain – no proxy_cookie_domain/path rewriting needed.
proxy_set_header Host              $host;
# This is the first hop: overwrite (don't append to) client-supplied X-Forwarded-* to prevent spoofing.
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  443;
proxy_set_header Proxy "";

# Cookies & sessions: Set-Cookie and Cookie headers are passed through unchanged. TYPO3 adds `Secure`
# itself once it knows the request is HTTPS. This is a backstop for cookies set without it.
proxy_cookie_flags ~ secure;

# Absolute redirects that still point to the plain-HTTP upstream are rewritten to the public URL
proxy_redirect http://$host/      https://$host/;
proxy_redirect http://$host:8080/ https://$host/;

# TYPO3 backend responses carry large headers (CSP, cookies) – avoid "upstream sent too big header"
proxy_buffer_size 32k;
proxy_buffers 8 32k;
proxy_busy_buffers_size 64k;

# Same as the inner fastcgi timeouts (long-running backend/scheduler/install tool requests)
proxy_connect_timeout 10s;
proxy_send_timeout    240s;
proxy_read_timeout    240s;

# Must match (or exceed) the inner nginx / PHP upload limits
client_max_body_size 64M;

# Responses are per-user once a session cookie exists: never cache them at the proxy
proxy_no_cache 1;
proxy_cache_bypass 1;

# Only headers the inner nginx doesn't already send. Add `preload` only once every subdomain serves HTTPS.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
