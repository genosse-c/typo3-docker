# Public, TLS-terminating reverse proxy for the TYPO3 stack – standalone nginx (no hosting panel).
# On an ISPConfig host use ispconfig-nginx-directives.conf instead; this file would clash with its vhosts.
#
# Runs on the Docker host (not in the stack) and forwards to the stack's `web` service, which listens on
# 127.0.0.1:${HTTP_PORT} (BIND_ADDRESS=127.0.0.1 in .env – keep it that way, only this proxy may talk to it).
#
# Install:
#   1. Replace every `example.tld` below with your domain.
#   2. Get a certificate, e.g.  certbot certonly --webroot -w /var/www/letsencrypt -d example.tld -d www.example.tld
#      and  openssl dhparam -out /etc/nginx/dhparam.pem 2048   (only needed for the DHE ciphers)
#   3. cp proxy/conf.d/typo3-upstream.conf /etc/nginx/conf.d/     (upstream + rate-limit zone; check the port)
#      cp proxy/snippets/typo3-proxy.conf   /etc/nginx/snippets/
#      cp proxy/typo3-proxy.conf            /etc/nginx/conf.d/example.tld.conf
#      nginx -t && systemctl reload nginx
#   4. In .env:  TYPO3_TRUSTED_HOSTS_PATTERN=example\.tld   TYPO3_BASE_URL=https://example.tld/
#      and set `base: 'https://example.tld/'` in app/config/sites/<site>/config.yaml, then `docker compose up -d`.
#
# Requires nginx >= 1.25.1 (`http2 on;`).

# --- HTTP: ACME challenge + redirect to HTTPS -------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name example.tld www.example.tld;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://example.tld$request_uri;
    }
}

# --- HTTPS: www -> apex ----------------------------------------------------------------------------------

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.example.tld;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/example.tld/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.tld/privkey.pem;

    return 301 https://example.tld$request_uri;
}

# --- HTTPS: TYPO3 ----------------------------------------------------------------------------------------

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.tld;
    server_tokens off;

    # TLS – Mozilla "intermediate" profile (TLS 1.2 + 1.3)
    ssl_certificate         /etc/letsencrypt/live/example.tld/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/example.tld/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/example.tld/chain.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_dhparam /etc/nginx/dhparam.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TYPO3SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    access_log /var/log/nginx/example.tld.access.log;
    error_log  /var/log/nginx/example.tld.error.log;

    location / {
        include snippets/typo3-proxy.conf;
    }

    location = /typo3/login {
        limit_req zone=typo3_login burst=5 nodelay;
        limit_req_status 429;
        include snippets/typo3-proxy.conf;
    }

    # Optional: restrict the backend and Install Tool to known networks (VPN / office)
    # location ^~ /typo3/ {
    #     allow 203.0.113.0/24;
    #     deny  all;
    #     include snippets/typo3-proxy.conf;
    # }
}
