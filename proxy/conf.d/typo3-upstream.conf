# http-level part of the TYPO3 reverse proxy.  Install as /etc/nginx/conf.d/typo3-upstream.conf
# (conf.d is included inside http {}; ISPConfig doesn't manage or overwrite it).

# The stack's `web` service: 127.0.0.1:${HTTP_PORT} from .env.
# On ISPConfig hosts 8080 (panel) and 8081 (apps) are already taken – set HTTP_PORT/PMA_PORT to free ports.
upstream typo3_stack {
    server 127.0.0.1:8080;
    keepalive 16;
}

# Brute-force protection for the backend login (A.8.5 / OWASP A07)
limit_req_zone $binary_remote_addr zone=typo3_login:10m rate=10r/m;
