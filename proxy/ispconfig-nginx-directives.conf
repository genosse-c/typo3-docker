# ISPConfig: Sites > Website > <your site> > Options > "nginx Directives".  Paste everything below.
#
# Prerequisites (once, as root):
#   cp proxy/conf.d/typo3-upstream.conf /etc/nginx/conf.d/
#   cp proxy/snippets/typo3-proxy.conf   /etc/nginx/snippets/
# Website settings: SSL + Let's Encrypt on, "Rewrite HTTP to HTTPS" on, PHP "Disabled".
#
# ISPConfig adds its own regex locations (`location ~ \.php$` – "deny all" with PHP disabled –,
# `location ~ /\.`, ...). Regex locations beat a plain `location /`, so every TYPO3 entry point is pinned
# with an exact (=) or ^~ location, which nginx prefers over regexes:
#   /index.php, /typo3/... (incl. install.php), /_assets/ (composer-mode extension assets).
# `##merge##` is ISPConfig syntax: merged into an existing `location /` if the template has one.

location / { ##merge##
    include snippets/typo3-proxy.conf;
}

location = /index.php {
    include snippets/typo3-proxy.conf;
}

location ^~ /typo3/ {
    include snippets/typo3-proxy.conf;
}

location ^~ /_assets/ {
    include snippets/typo3-proxy.conf;
}

location ^~ /fileadmin/ {
    include snippets/typo3-proxy.conf;
}

location ^~ /typo3temp/assets/ {
    include snippets/typo3-proxy.conf;
}

location = /typo3/login {
    limit_req zone=typo3_login burst=5 nodelay;
    limit_req_status 429;
    include snippets/typo3-proxy.conf;
}

# Optional: restrict the backend and Install Tool to known networks (VPN / office)
# location ^~ /typo3/ {
#     allow 203.0.113.0/24;
#     deny  all;
