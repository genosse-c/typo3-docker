# TYPO3 on nginx, based on the configuration recommended in the TYPO3 documentation.

# Behind the TLS-terminating proxy (proxy/typo3-proxy.conf), requests arrive from the Docker bridge gateway.
# X-Forwarded-* is trusted only from there. With BIND_ADDRESS=127.0.0.1, that can only be the local proxy.
geo $realip_remote_addr $from_trusted_proxy {
    default       0;
    127.0.0.1     1;
    172.16.0.0/12 1;  # Docker default bridge address pools
}
map "$from_trusted_proxy:$http_x_forwarded_proto" $forwarded_https {
    "1:https" on;
    default   "";
}

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    server_tokens off;
    client_max_body_size 64M;

    # Real client IP from the trusted proxy (TYPO3 logs, login rate limiting, IP locking of sessions)
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Versioned static files (e.g. main.1700000000.css)
    if (!-e $request_filename) {
        rewrite ^/(.+)\.(\d+)\.(php|js|css|png|jpg|gif|gzip)$ /$1.$3 last;
    }

    # Hidden files, except .well-known
    location ~ /\.(?!well-known/) { deny all; }

    # Protected TYPO3 files and folders
    location ~* composer\.(?:json|lock)$                              { deny all; }
    location ~* flexform[^.]*\.xml$                                   { deny all; }
    location ~* locallang[^.]*\.(?:xml|xlf)$                          { deny all; }
    location ~* ext_conf_template\.txt|ext_typoscript_constants\.txt|ext_typoscript_setup\.txt { deny all; }
    location ~* /.*\.(?:bak|co?nf|cfg|ya?ml|ts|typoscript|tsconfig|dist|fla|in[ci]|log|sh|sql|sqlite)$ { deny all; }
    location ~ _(?:recycler|temp)_/                                   { deny all; }
    location ~ fileadmin/(?:templates)/.*\.(?:txt|ts|typoscript)$     { deny all; }
    location ~ ^/(?:vendor|typo3_src|typo3temp/var)/                  { deny all; }
    location ~ (?:typo3conf/ext|typo3/sysext|typo3/ext)/[^/]+/(?:Configuration|Resources/Private|Tests?|Documentation|docs?)/ { deny all; }

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # TYPO3 backend (routed through public/index.php since v12)
    location = /typo3 {
        rewrite ^ /typo3/;
    }
    location /typo3/ {
        absolute_redirect off;
        try_files $uri /index.php$is_args$args;
    }

    location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        if (!-f $document_root$fastcgi_script_name) {
            return 404;
        }
        fastcgi_buffer_size 32k;
        fastcgi_buffers 8 16k;
        fastcgi_connect_timeout 240s;
        fastcgi_read_timeout 240s;
        fastcgi_send_timeout 240s;

        fastcgi_pass typo3:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTP_PROXY "";
        # TLS ends at the proxy: tell TYPO3 the request was HTTPS, so it builds https:// URLs and sets Secure cookies
        fastcgi_param HTTPS $forwarded_https if_not_empty;
    }
}
