[www]
; Used by the container healthcheck (not routed through nginx)
ping.path = /ping
ping.response = pong

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6

; FPM clears the environment by default – pass through only what TYPO3 needs at runtime
; (setup-only variables such as the admin password are deliberately not forwarded)
env[TYPO3_CONTEXT] = $TYPO3_CONTEXT
env[TYPO3_TRUSTED_HOSTS_PATTERN] = $TYPO3_TRUSTED_HOSTS_PATTERN
env[TYPO3_DB_HOST] = $TYPO3_DB_HOST
env[TYPO3_DB_PORT] = $TYPO3_DB_PORT
env[TYPO3_DB_DBNAME] = $TYPO3_DB_DBNAME
env[TYPO3_DB_USERNAME] = $TYPO3_DB_USERNAME
env[TYPO3_DB_PASSWORD] = $TYPO3_DB_PASSWORD
